name: Compile BW16 Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 python3

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Core and Compile
        run: |
          set -e
          URL="https://github.com/ambiot/ambd_arduino/raw/master/Arduino_package/package_realtek_amebad_index.json"
          
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "$URL"
          
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install realtek:amebad --additional-urls "$URL"
          arduino-cli lib install "Adafruit GFX Library" "Adafruit SSD1306"

          mkdir -p BW16
          cp * BW16/ 2>/dev/null || true

          arduino-cli compile --fqbn realtek:amebad:BW16 --additional-urls "$URL" --output-dir ./build BW16

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BW16-Firmware
          path: ./build/*.bin
