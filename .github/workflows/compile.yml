name: Compile BW16 Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Prepare and Compile
        run: |
          URL="https://github.com/ambiot/ambd_arduino/raw/master/Arduino_package/package_realtek_amebad_index.json"
          
          # Налаштування та завантаження ядра
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls $URL
          arduino-cli core update-index --additional-urls $URL
          arduino-cli core install realtek:amebad@3.0.8 --additional-urls $URL
          
          # Встановлення потрібних бібліотек
          arduino-cli lib install "Adafruit GFX Library" "Adafruit SSD1306"

          # Підготовка структури проєкту (створюємо папку BW16)
          mkdir -p BW16
          cp * BW16/ 2>/dev/null || true

          # Компіляція скетчу
          arduino-cli compile --fqbn realtek:amebad:BW16 --additional-urls $URL --output-dir ./build BW16

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BW16-Firmware
          path: ./build/*.bin
